[package]
name = "agent-loadgen-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP service for in-process plan previews and replay bundle exports"
repository.workspace = true
publish = false

[dependencies]
agent-loadgen-generate = { version = "0.1.0", path = "../generate" }
agent-loadgen-replay = { version = "0.1.0", path = "../replay" }
agent-loadgen-trace = { version = "0.1.0", path = "../trace" }
aho-corasick = "1"
anyhow = "1"
aws-sdk-s3 = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
