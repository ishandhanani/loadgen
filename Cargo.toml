[workspace]
members = [
    ".",
    "crates/core",
    "crates/generate",
    "crates/replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-dev/agent-loadgen"

[package]
name = "agent-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Generated coding-agent load with faithful KV shape and timing for Dynamo"
readme = "README.md"
repository.workspace = true
publish = false

[dependencies]
agent-loadgen-core = { version = "0.1.0", path = "crates/core", features = ["clap"] }
agent-loadgen-generate = { version = "0.1.0", path = "crates/generate" }
agent-loadgen-replay = { version = "0.1.0", path = "crates/replay" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
