# The coding-agent traffic of the astra production fleet: 66,995 root and
# 3,780 child sessions (1.16M requests) across eight models over 63 days,
# mostly OpenCode with some Claude Code and Codex. Every distribution below is
# fitted to that data's percentiles; see the measured values in each comment.
#
# Planned against the data: requests per root session p50/p90/p99 7/36/115
# (astra 7/30/131), input tokens 29k/129k/311k (33k/152k/390k), output tokens
# p50/p90 107/840 (108/760), 1.05 sessions per tree (1.06). The shape's ideal
# prefix-cache hit rate is 0.96; astra achieved 0.60, which is the deployment's
# routing and eviction, not the traffic. Not reproduced: astra's contexts drop
# after 12% of sessions, mostly below 25k tokens, which are harness resets
# rather than context-window compaction.
#
# The schedule is astra's mean session starts per UTC hour, one day long. It
# includes the fleet's two daily bursts (02-03 and 19-20 UTC). Multiply the
# rates to run the same shape at more sessions; shrink bucket_minutes to play
# the day faster at the same load level.

schema_version = 5
seed = 42

[load.arrivals]
bucket_minutes = 60
sessions_per_minute = [
  0.54, 0.66, 2.51, 1.86, 0.82, 0.42, 0.37, 0.43, 0.41, 0.35, 0.40, 0.39,
  0.30, 0.37, 0.30, 0.37, 0.37, 0.52, 0.53, 1.05, 2.79, 0.46, 0.59, 0.93,
]

[trajectory]
# Root sessions: p10 2, p50 7, p90 30, p99 131 requests.
turns = { kind = "log_normal", median = 7.0, sigma = 1.2, min = 1, max = 3000 }
# Gap before the next user message after a text-only response: p50 5 s,
# p90 125 s, p99 32 min.
think_time_ms = { kind = "log_normal", median = 4980.0, sigma = 2.51, min = 200, max = 3600000 }
# Outputs: p10 49, p50 108, p90 760, p99 6,722; sigma splits the p90 and p99 fits.
output_tokens = { kind = "log_normal", median = 108.0, sigma = 1.6, min = 1, max = 32000 }

[tokens]
# First requests: p10 674, p50 3,739, p90 15,329 tokens.
system_prefix_tokens = { kind = "fixed", value = 1000 }
tool_catalog_tokens = { kind = "fixed", value = 1000 }
repository_tokens = { kind = "log_normal", median = 1300.0, sigma = 1.7, min = 0, max = 60000 }
session_tokens = { kind = "uniform", min = 16, max = 256 }
user_tokens = { kind = "log_normal", median = 400.0, sigma = 1.8, min = 16, max = 60000 }
tool_result_tokens = { kind = "log_normal", median = 365.0, sigma = 1.55, min = 16, max = 20000 }
context_window_tokens = 400000

[behavior]
# Non-final turns: 85.7% one tool call, 7.8% parallel calls, 6.5% text;
# 0.33% of root turns spawn a subagent, 2.2% of spawns start several.
tool_probability = 0.857
parallel_tool_probability = 0.078
subagent_probability = 0.0032
swarm_probability = 0.0001
completion_probability = 0.0

[compaction]
# The largest astra contexts reach 390k tokens (p99), so the window is wide.
trigger_fraction = 0.9
summary_output_tokens = { kind = "uniform", min = 1000, max = 4000 }
retained_recent_tokens = 2048

[subagents]
max_depth = 1
# Child sessions: p10 1, p50 5, p90 23, p99 99 requests.
turns = { kind = "log_normal", median = 5.0, sigma = 1.18, min = 1, max = 400 }
fanout = { kind = "uniform", min = 2, max = 3 }

[tools]
# Parallel batches: p50 2, p90 4, p99 8 calls.
parallel_count = { kind = "log_normal", median = 2.2, sigma = 0.47, min = 2, max = 8 }

# Weights are each class's share of single-call turns. Latency is the gap from
# a response to the request carrying its results (p50 and p90 fitted); the
# tail includes permission prompts and other human waits. Result tokens are
# the prompt growth that request adds.
[[tools.classes]]
name = "shell"
weight = 0.529
latency_ms = { kind = "log_normal", median = 2042.0, sigma = 1.93, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 138.0, sigma = 1.92, min = 1, max = 40000 }

[[tools.classes]]
name = "read"
weight = 0.111
latency_ms = { kind = "log_normal", median = 1913.0, sigma = 3.24, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 893.0, sigma = 1.56, min = 16, max = 40000 }

[[tools.classes]]
name = "patch"
weight = 0.082
latency_ms = { kind = "log_normal", median = 1622.0, sigma = 1.11, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 19.0, sigma = 0.36, min = 1, max = 4000 }

[[tools.classes]]
name = "search"
weight = 0.070
latency_ms = { kind = "log_normal", median = 1785.0, sigma = 3.61, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 75.0, sigma = 2.55, min = 1, max = 30000 }

[[tools.classes]]
name = "other"
weight = 0.044
latency_ms = { kind = "log_normal", median = 2623.0, sigma = 1.49, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 509.0, sigma = 1.93, min = 1, max = 40000 }

[[tools.classes]]
name = "orchestration"
weight = 0.012
latency_ms = { kind = "log_normal", median = 2235.0, sigma = 2.72, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 365.0, sigma = 1.55, min = 16, max = 20000 }

[[tools.classes]]
name = "network"
weight = 0.009
latency_ms = { kind = "log_normal", median = 2121.0, sigma = 1.19, min = 50, max = 1800000 }
result_tokens = { kind = "log_normal", median = 1618.0, sigma = 1.71, min = 16, max = 60000 }
