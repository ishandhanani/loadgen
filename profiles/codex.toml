# SPDX-License-Identifier: Apache-2.0

# Interactive Codex sessions: shell-heavy tool loops with frequent parallel
# exec batches, compaction at 90% of the context window, asynchronous child
# threads one level deep, and human pauses between prompts. Shape only; run
# with `--headers codex` so the requests also carry Codex's headers.
#
# Evidence: Codex sessions in SWE-chat (SALT-NLP/SWE-chat) put 55-65% of tool
# calls in overlapping batches and showed an 11k system prompt plus 9k tool
# catalog. The Codex source (codex-rs) compacts at no more than 90% of the
# context window, allows nesting depth one, and spawns child threads without
# waiting on them. Session length, human think time, and tool latencies are
# assumptions.
#
# The [load] section is a small closed-loop smoke load. Replace it with a
# [load.arrivals] schedule to model a fleet; see docs/workloads.md.

schema_version = 5
seed = 42

[load]
num_sessions = 16
concurrent_sessions = 8

[trajectory]
turns = { kind = "log_normal", median = 60.0, sigma = 0.9, min = 4, max = 500 }
# A final response hands control back to the developer.
think_time_ms = { kind = "log_normal", median = 30000.0, sigma = 1.0, min = 2000, max = 600000 }
output_tokens = { kind = "log_normal", median = 350.0, sigma = 1.0, min = 16, max = 8000 }

[tokens]
system_prefix_tokens = { kind = "fixed", value = 11000 }
tool_catalog_tokens = { kind = "fixed", value = 9000 }
repository_tokens = { kind = "log_normal", median = 3000.0, sigma = 0.8, min = 256, max = 20000 }
session_tokens = { kind = "uniform", min = 256, max = 1024 }
user_tokens = { kind = "log_normal", median = 150.0, sigma = 1.0, min = 16, max = 4096 }
tool_result_tokens = { kind = "log_normal", median = 1000.0, sigma = 0.9, min = 128, max = 16384 }
context_window_tokens = 200000

[behavior]
tool_probability = 0.39
parallel_tool_probability = 0.19
subagent_probability = 0.04
swarm_probability = 0.02
completion_probability = 0.01

[compaction]
trigger_fraction = 0.9

[subagents]
# Spawning is asynchronous; waiting on children is a separate choice.
max_depth = 1
turns = { kind = "log_normal", median = 8.0, sigma = 0.6, min = 2, max = 50 }
fanout = { kind = "uniform", min = 2, max = 4 }
blocking_probability = 0.5

[tools]
parallel_count = { kind = "uniform", min = 2, max = 4 }

[[tools.classes]]
name = "shell"
weight = 0.60
latency_ms = { kind = "log_normal", median = 800.0, sigma = 1.3, min = 10, max = 120000 }
result_tokens = { kind = "log_normal", median = 350.0, sigma = 1.3, min = 8, max = 16000 }
error_probability = 0.10

[[tools.classes]]
name = "patch"
weight = 0.18
latency_ms = { kind = "log_normal", median = 60.0, sigma = 0.7, min = 10, max = 2000 }
result_tokens = { kind = "log_normal", median = 120.0, sigma = 0.8, min = 16, max = 4000 }
error_probability = 0.05

[[tools.classes]]
name = "search"
weight = 0.12
latency_ms = { kind = "log_normal", median = 150.0, sigma = 0.9, min = 10, max = 5000 }
result_tokens = { kind = "log_normal", median = 400.0, sigma = 1.1, min = 16, max = 8000 }
error_probability = 0.02

[[tools.classes]]
name = "network"
weight = 0.03
latency_ms = { kind = "log_normal", median = 3000.0, sigma = 0.9, min = 300, max = 30000 }
result_tokens = { kind = "log_normal", median = 2500.0, sigma = 1.0, min = 128, max = 16000 }
error_probability = 0.10

[[tools.classes]]
name = "orchestration"
weight = 0.07
latency_ms = { kind = "log_normal", median = 30.0, sigma = 0.5, min = 2, max = 500 }
result_tokens = { kind = "log_normal", median = 100.0, sigma = 0.6, min = 16, max = 1000 }
error_probability = 0.0
